services:
  postgres:
    image: postgres:16-alpine
    container_name: dynasties-pg
    environment:
      POSTGRES_USER: dynasties
      POSTGRES_PASSWORD: dynasties
      POSTGRES_DB: dynasties
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dynasties -d dynasties"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
