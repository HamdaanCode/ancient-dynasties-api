name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Static analysis
        run: go vet ./...

      # testcontainers spins up a real Postgres container for every test run.
      # The ubuntu-latest runner ships with Docker so this just works.
      - name: Integration tests
        run: go test -count=1 ./...

      - name: Docker build
        run: docker build -t ancient-dynasties-api:ci .
